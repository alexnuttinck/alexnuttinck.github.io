- title: "Deploying Odoo on Kubernetes: a production-ready Helm chart and the lessons behind it"
  publishedIn:
    name: "Talk · OCA Days 2026 - Liège"
    date: 23 September 2026
    url: https://www.odoo-community.org/event/oca-days-2026-liege-244/track/14-40-15-10-deploying-odoo-on-kubernetes-a-production-ready-helm-chart-and-the-lessons-behind-it-30mins-456
  authors:
  - name: Alexandre Nuttinck
  paper:
    summary: |
      Odoo.sh is a great fit for many teams, but some organizations need full control over their infrastructure: for compliance, multitenancy, cost, or integration with an existing cloud-native stack. At iMio, a Walloon intermunicipal association serving local authorities, we built an open-source Helm chart to deploy and operate Odoo on Kubernetes, and we now run several distinct workloads in production with it.

      This talk walks through the real engineering decisions behind that chart: how we handle the Odoo/PostgreSQL split, persistent storage and the filestore, configuration and secrets management, worker scaling, upgrades and database migrations, and zero-downtime considerations. We'll be honest about what broke along the way and what we'd do differently.

      Attendees will leave with a clear mental model of what it takes to run Odoo reliably on Kubernetes, a reusable open-source chart they can adopt or fork, and concrete patterns for scaling and maintenance.

      **Target audience:** developers, DevOps and platform engineers, and technical integrators evaluating self-hosted Odoo at scale. Basic familiarity with containers and Odoo's architecture is helpful but not required.
  links:
  - name: Video
    url: https://www.youtube.com/watch?v=Y8DebBizYVg
  - name: Slides
    url: https://slides.imio.be/2026-09/oca-days-odoo-kubernetes/slides.html
  categories: ["talks"]
  tags: ["Odoo", "Kubernetes", "Helm", "PostgreSQL", "DevOps", "Open Source"]

- title: "Multitenancy in Odoo: one instance to rule them all"
  publishedIn:
    name: "Talk · OCA Days 2025 - Liège"
    date: 17 September 2025
    url: https://www.odoo-community.org/event/oca-days-2025-liege-174/track/10-50-11-20-multitenancy-in-odoo-one-instance-to-rule-them-all-359
  authors:
  - name: Alexandre Nuttinck
  paper:
    summary: |
      In this talk, I'll explore how we designed and implemented a multitenant architecture that currently supports 78 Odoo tenants in production at iMio.

      I'll walk you through our decision-making process behind adopting multitenancy for our project management tool, [iA.Vision](https://www.imio.be/apps-et-services/ia-vision), built on Odoo. You'll learn about the benefits and trade-offs of multitenancy in the context of Odoo, the technical challenges we encountered, and how we addressed them using Kubernetes, S3-compatible storage, and Postgres-native tools.

      This session is aimed at Odoo integrators, DevOps engineers, and solution architects who are exploring advanced Odoo deployments and want real-world feedback from a public-sector production environment.
  links:
  - name: Video
    url: https://www.youtube.com/watch?v=ggDsdvJm38s
  - name: Slides
    url: /files/talks/oca-days-2025-multitenancy-in-odoo.pdf
  categories: ["talks"]
  tags: ["Odoo", "Multitenancy", "Kubernetes", "S3", "PostgreSQL", "DevOps"]

- title: "FADI - A Deployment Framework for Big Data Management and Analytics"
  publishedIn:
    name: "2020 IEEE 29th International Conference on Enabling Technologies: Infrastructure for Collaborative Enterprises (WETICE)"
    date: 10-13 September 2020
    url: https://ieeexplore.ieee.org/document/9338535
  authors:
  - name: Rami Sellami
  - name: Faiez Zalila
  - name: Alexandre Nuttinck
  - name: Sébastien Dupont
  - name: Jean-Christophe Deprez
  - name: Stéphane Mouton
  paper:
    summary: The production of huge amount of data and the emergence of new technologies in the industry sector have introduced new requirements for big data management. Many applications need to interact with several heterogeneous data sources to ingest, harmonise (normalise), persist, analyse and synthesize results to enable informed decisions and draw benefits from data. These operations are ensured by different tools and these tools are heterogeneous and not connected with each other. Besides, the whole tool-chain lacks automation in terms of its deployment, its operational workflow and its orchestration for satisfying the elastic and resilient properties needed by Industry. In this paper, we present FADI, a framework for deploying and orchestrating a Big Data management and analysis platform fully composed of open source tools. FADI has been developed through several research projects, namely, BigData@MA, Grinding 4.0, Quality 4.0 and ARTEMTEC where Industry use cases are used for validation purposes.
    url: https://ieeexplore.ieee.org/document/9338535
  categories: ["papers"]
  tags: ["Big Data", "Deployment", "DevOps", "Kubernetes", "Helm", "Open Source"]

